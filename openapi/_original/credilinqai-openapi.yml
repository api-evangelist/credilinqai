    DisburseLoanStatusResponse:
      type: object
      properties:
        loanId:
          type: string
          default: string
          description: Id of the created loan
        loanReferenceNo:
          type: string
          default: string
          description: Reference Number of the created loan for eg. BNPL***
        customerReferenceNo:
          type: string
          default: ''
          description: Customer Reference number, for which loan is created
        loanTerm:
          type: number
          example: 30
          description: Duration of the loan. Based on loan terms selected at the cusomer level, The customer for whom loan
            is being created should be
          enum:
          - 30
          - 45
          - 60
          - 90
          - 120
          - 150
          - 180
          - 210
          - 240
          - 270
          - 300
          - 330
          - 360
          default: 30
        loanType:
          type: string
          description: "Type of loan\n    \n We support these two types,\n    \n 1. ```BNPL``` - Buyer Financing\n    \n 2.\
            \ ```GMV``` - Seller Financing"
          example: BNPL
        loanStatus:
          type: string
          description: "Status of loan\n    \n We support these three statuses,\n    \n 1. ```pending-for-approval``` - Loan\
            \ is pending for approval\n    \n 2. ```waiting-for-disbursal``` - Loan is pending for disbursal,\n    \n 3. ```active```\
            \ - Loan is active,\n    \n 4. ```rejected``` - Loan is rejected for some reason,\n    \n 5. ```closed``` - Loan\
            \ is paid & closed"
          example: active
        disbursalAmount:
          type: number
          description: Loan Amount
          default: 2000
        totalDueAmount:
          type: number
          description: Total Loan Due Amount
          default: 2000
        loanDueDate:
          type: string
          description: Loan Due Date in Local Format eg. 21 Aug 2023
          default: 21 August 2023
          example: 21 August 2023
        loanDueDateUTC:
          type: string
          description: Loan Due Date in UTC Format eg. 2023-08-20T18:30:00.000Z
          default: '2023-08-20T18:30:00.000Z'
          example: '2023-08-20T18:30:00.000Z'
        dueDatePostGracePeriod:
          type: string
          description: Loan Due Date with grace period in Local Format eg. 24 Aug 2023
          default: 24 August 2023
          example: 24 August 2023
        dueDatePostGracePeriodUTC:
          type: string
          description: Loan Due Date with grace period in UTC Format eg. 2023-08-23T18:30:00.000Z
          default: '2023-08-23T18:30:00.000Z'
          example: '2023-08-23T18:30:00.000Z'
        gracePeriodInDays:
          type: number
          description: Grace Period(In Days), After which loan goes into overdue.
          default: 3
          example: 3
        charges:
          type: number
          description: Total Monthly Charges(%) Applied on Loan Amount
          default: 1
        chargesApplied:
          type: number
          description: Total Amount of Charges Applied on Loan Amount
          default: 50
        customerApprovedCredit:
          type: number
          description: Customer Approved Credit Line
          default: 20000
        customerAvailableCredit:
          type: number
          description: Customer Remaining Credit Line after loan
          default: 17500
        remark:
          type: string
          description: Remark given while requesting for loan
          default: string
        metadata:
          type: string
          default: string
          description: Metadata for loans. It can be used for reporting, reconciliation purpose.
        createdAt:
          type: string
          default: '2025-01-08T05:12:17.405Z'
          description: Created Timestamp of the created loan in UTC Format eg. 2023-03-30T11:46:42.195Z
        updatedAt:
          type: string
          default: '2025-01-08T05:12:17.405Z'
          description: Updated Timestamp of the created loan in UTC Format eg. 2023-03-30T11:46:42.195Z
        currency:
          type: string
          default: SGD
          description: Currency Code
      required:
      - loanId
      - loanReferenceNo
      - customerReferenceNo
      - loanTerm
      - loanType
      - loanStatus
      - disbursalAmount
      - totalDueAmount
      - loanDueDate
      - loanDueDateUTC
      - dueDatePostGracePeriod
      - dueDatePostGracePeriodUTC
      - gracePeriodInDays
      - charges
      - chargesApplied
      - customerApprovedCredit
      - customerAvailableCredit
      - remark
      - metadata
      - createdAt
      - updatedAt
      - currency
