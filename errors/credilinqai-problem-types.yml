envelope:
  description: >-
    CrediLinq returns a consistent JSON error envelope (not RFC 9457
    problem+json). Errors carry a numeric statusCode, a human-readable error
    string, a computer-readable errorCode (e.g. E_BAD_REQUEST), a message with
    details, and success:false.
  fields:
    statusCode: HTTP status code of the error
    error: Human-readable generic error message
    errorCode: Computer-readable code for error handling
    message: Human-readable error message with all available details
    success: Boolean, false on error responses
