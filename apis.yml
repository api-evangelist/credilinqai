aid: credilinqai
name: Credilinq.ai
description: >-
  CrediLinq is a Singapore-founded embedded-finance and B2B lending fintech that lets
  platforms and marketplaces offer white-labeled credit to their business customers.
  Its API-first "Credit as a Service" powers two products: B2B PayLater (buy-now-pay-later
  for buyers) and GMV Financing (working-capital advances for sellers), with AI/data-driven
  credit underwriting, automated onboarding and KYC, credit-line management, loan drawdowns,
  repayments and reconciliation, and partner reporting. The CrediLinq REST API (OpenAPI 3.0,
  Auth0 client-credentials bearer auth, sandbox/staging/production environments, HMAC-signed
  webhooks) is documented at docs.credilinq.ai.
